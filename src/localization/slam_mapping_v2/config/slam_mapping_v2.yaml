# =============================================================================
# slam_mapping_v2 配置（仅 v2 自有键）
# 订阅 slam_odometry_v2 的 odom / registered_scan，消息驱动建图。
# =============================================================================

runtime:
  auto_start: true
  task_name: "manual_mapping"
  output_root: "/home/hhy/2004ros/deeplumin_mapping_2"
  publish_tf: true           # 发布 map→odom（有关键帧后即发布）
  process_rate_hz: 100.0

frames:
  map: "map"
  odom: "odom"
  base_link: "base_link"

input:
  odom_topic: "/slam_odometry/odom"
  scan_topic: "/slam_odometry/cloud_registered"
  gnss_topic: "/gnss_chc_data"
  image_topic: "/camera/li_image"  # 视觉回环用

  # odom_topic: "/localization/slam_odom"
  # scan_topic: "/localization/cloud_registered_effect"
  # gnss_topic: "/gnss_chc_data"
  # image_topic: "/camera/color/image_raw/compressed"  # 视觉回环用

output:
  status_topic: "/slam_mapping_v2/status"
  path_topic: "/slam_mapping_v2/path"
  map_topic: "/slam_mapping_v2/map"
  loop_markers_topic: "/slam_mapping_v2/loop_markers"
  keyframe_markers_topic: "/slam_mapping_v2/keyframes"
  publish_odom: false            # 转发 odom（冗余，默认关）
  publish_current_scan: false    # 转发 registered_scan（冗余，默认关）
  publish_debug_markers: true   # 回环/关键帧 marker（调试）

services:
  start: "/slam_mapping_v2/start"
  stop: "/slam_mapping_v2/stop"
  save: "/slam_mapping_v2/save"
  reset: "/slam_mapping_v2/reset"
  get_status: "/slam_mapping_v2/get_status"

threading:
  backend_interval_sec: 0.1
  viz_interval_sec: 0.5
  max_input_queue: 20
  time_sync_tolerance_sec: 0.1

keyframe:
  distance_thresh: 0.6
  rotation_thresh_rad: 0.5
  time_thresh_sec: 0.0
  min_points: 50
  min_frame_gap: 10

loop_closure:
  enable: false
  # 检测器类型："laser" | "visual" | "hybrid"
  detector_type: "laser"
  # 回环候选帧筛选：当前关键帧与历史关键帧的最小索引间隔，低于此值不检测回环
  min_index_gap: 10
  # 回环候选帧筛选：当前帧与历史候选帧的最小时间间隔（秒），低于此值跳过（避免检测太近的回环）
  time_thresh_sec: 5.0
  # 回环检测触发间隔：两次回环检测之间至少间隔 loop_kf_gap 个关键帧，防止过于频繁检测
  loop_kf_gap: 10
  # 回环去重：若新检测到的历史帧索引与已确认回环的历史帧索引差小于此值，视为重复回环并跳过
  min_id_interval: 10
  # 回环候选帧筛选：当前帧与历史帧索引差必须大于 closest_id_th，确保检测的是“远距离”回环
  closest_id_th: 20
  # KD-Tree 空间搜索半径（米）：在当前帧位姿附近 max_range 范围内搜索历史关键帧作为回环候选
  max_range: 10.0
  # 子图构建：以候选历史帧为中心，前后各取 submap_search_num 个关键帧拼接成历史子图用于 ICP 配准
  submap_search_num: 5
  # 子图降采样体素分辨率（米）：拼接子图后通过 VoxelGrid 降采样，降低 ICP 计算量
  submap_resolution: 0.2
  # ICP 配准 fitness score 阈值：ICP 得分高于此阈值认为配准失败，回环不成立
  icp_fitness_thresh: 0.1
  # 回环噪声整体缩放系数：用于动态调整回环约束噪声的强弱，值越大噪声越大、约束越弱
  loop_noise_scale: 1.0
  # 回环约束旋转噪声基准（弧度）：用于 GTSAM 回环因子的旋转分量标准差
  loop_rot_noise: 0.05
  # 回环约束平移噪声基准（米）：用于 GTSAM 回环因子的平移分量标准差
  loop_pos_noise: 0.5
  # 回环得分下限：计算噪声模型时，ICP fitness score 不会低于此值，防止过优配准导致噪声过小
  loop_score_floor: 0.05
  # 里程计因子旋转噪声（弧度）：GTSAM 中相邻关键帧间 odometry 约束的旋转分量方差
  odom_rot_noise: 1e-6
  # 里程计因子平移噪声（米）：GTSAM 中相邻关键帧间 odometry 约束的平移分量方差
  odom_pos_noise: 1e-4

  # ===== 视觉回环配置（detector_type: "visual" 或 "hybrid" 时生效） =====
  visual:
    # ORB 词库路径（从 ORB-SLAM3 移植的预训练词库）
    vocabulary_path: "/home/hhy/2004ros/DeepLumin/src/localization/slam_mapping_v2/thirdparty/DBoW2/vocabulary/ORBvoc.txt"
    # ORB 特征参数
    nfeatures: 3000
    scale_factor: 1.2
    nlevels: 8
    ini_th_fast: 15
    min_th_fast: 5
    # BoW 检索参数
    min_bow_score: 0.03
    min_shared_words: 15
    max_candidates: 6
    # 特征匹配参数
    min_bow_matches: 40
    nn_ratio: 0.65
    # RANSAC 几何验证参数
    ransac_min_inliers: 15
    ransac_probability: 0.99
    ransac_max_iterations: 300
    # 连续性验证参数
    min_continuity: 1
    max_continuity_miss: 3
    # 线程参数
    feature_extract_rate_hz: 10
    buffer_size: 100
    # 相机内参（几何验证必需，请根据实际相机标定修改）
    camera:
      # fx: 617.971050917033
      # fy: 616.445131524790
      # cx: 327.710279392468
      # cy: 253.976983707814
      fx: 960.0
      fy: 960.0
      cx: 510.0
      cy: 960.0
     
    # LiDAR 到相机的外参 T_L_C（4x4 齐次变换矩阵，行优先）
    # 默认值：相机 x=LiDAR z, 相机 y=-LiDAR x, 相机 z=-LiDAR y
    # T_L_C: [0., 0., 1., 0.30456,
    #        -1., 0., 0., 0.00065,
    #         0.,-1., 0., 0.65376,
    #         0., 0., 0., 1.]
    T_L_C: [0.,  -1.,  0.,  0.,
              0.,  0.,  1.,  0.3,
              1., 0.,  0.,  0.,
              0.,  0.,  0.,  1.]


  gnss:
    enable: false
    min_status: 33
    min_nsv: 0
    max_age_sec: 0.02
    min_spacing_m: 6.0
    use_gps_elevation: false
    z_override_sigma: 0.01
    sigma_fixed: 0.3
    sigma_float: 1.5
    sigma_unknown: 3.0
    sigma_floor: 0.2
    robust_delta: 1.0
    alignment_frames: 20
    consistency_thresh_m: 10.0
    lever_arm: [0.0, 0.0, 0.0]
    status_sigma: []

map_saver:
  default_resolution: 0.1
  save_on_stop: true
  save_keyframes: true
  save_keyframe_poses: true
  save_trajectory: true
  save_loop_results: true
  map_filename: "map.pcd"
  trajectory_filename: "trajectory.csv"
  keyframe_pose_filename: "keyframes.csv"
  keyframe_dir_name: "keyframes"
  mages_dir_name: "images"
  loop_result_dir_name: "loop_results"
  loop_pairs_filename: "loop_pairs.csv"
  loop_current_submap_filename: "latest_loop_current_submap.pcd"
  loop_history_submap_filename: "latest_loop_history_submap.pcd"

map:
  voxel_resolution: 0.5     # iVox 体素分辨率
  filter_size_map: 0.2      # 插入去重距离
  publish_voxel_leaf: 0.5   # 发布地图降采样
  publish_global_map: true