# =============================================================================
# pose_fusion.yaml — 位姿融合模块运行参数
#
# 由 pose_fusion.launch 通过 <rosparam command="load"> 注入节点私有命名空间。
# 读取入口：pose_fusion_ros::loadFusionConfig(pnh) → FusionConfig
# =============================================================================

# --- TF / 坐标系命名 -----------------------------------------------------------
# 融合输出与 TF 发布使用的标准三层：map → odom → base_link
frames:
  map: map
  odom: odom
  base_link: base_link

# --- 地图标识 ------------------------------------------------------------------
# Global Matcher / Relocalization 结果中的 map_id 需与此一致（质量门会校验）
map:
  default_map_id: default

# --- Topic 映射 ----------------------------------------------------------------
# 输入：DR / SLAM / 全局匹配 / 重定位 / 观测策略 / 手动初值
# 输出：融合里程计、位姿、路径、融合状态
topics:
  dr_odom: /localization/dr_odom
  dr_status: /localization/dr_status
  slam_odom: /localization/slam_odom
  slam_health: /localization/slam_health
  global_matcher_result: /localization/global_matcher/result
  global_matcher_status: /localization/global_matcher/status
  accepted_relocalization: /localization/manager/accepted_relocalization
  observer_policy: /localization/manager/observer_policy
  # Full system input from localization_manager. Use launch override for direct /initialpose debug.
  initial_pose: /localization/manager/initial_pose
  fused_odom: /localization/fused_odom
  fused_pose: /localization/fused_pose
  fused_path: /localization/fused_path
  fusion_status: /localization/fusion_status

# --- 运行时行为 ----------------------------------------------------------------
runtime:
  # 定时器频率：PoseFusionNode::onTimer → core.tick() / 发布
  output_rate_hz: 100.0
  publish_tf: true
  # 发布 map→odom（融合外参，通常由本节点负责）
  publish_map_to_odom_tf: true
  # Full system default: avoid competing with dr/slam odom->base_link debug TF.
  # 默认不发 odom→base，避免与 DR/SLAM 调试 TF 抢广播
  publish_odom_to_base_tf: false
  publish_path: true
  max_path_size: 5000
  allow_debug_relocalization_direct: false

# --- 初始化策略 ----------------------------------------------------------------
initialization:
  # production: wait for localization_manager/initial_pose or accepted relocalization.
  # debug: launch files may override DR/SLAM cold start for standalone tests.
  operation_mode: production
  allow_initialpose: true
  allow_dr_initialization: false
  allow_slam_initialization: false
  # Allow a high-quality global_matcher result to initialize map_odom with latest DR/SLAM odom_base.
  allow_global_matcher_initialization: true
  # GM registration may arrive later than the source cloud stamp. Use a looser gate only for initialization.
  global_matcher_init_max_predictor_time_offset: 1.0
  require_predictor_for_reset: true
  initial_cov_position: 1.0
  initial_cov_yaw_deg: 5.0

# --- DR 预测（里程计递推）门限与过程噪声 --------------------------------------
prediction:
  # 相邻 DR 时间间隔 / 位移 / 航向变化超限则拒绝本步递推
  max_dr_gap: 0.2
  max_dr_delta_translation: 5.0
  max_dr_delta_yaw_deg: 45.0
  # 接受 DR 后按 dt 累加到协方差对角元
  process_noise_position: 0.05
  process_noise_yaw_deg: 0.5

# --- 观测器（平滑更新增益与残差门限）------------------------------------------
observers:
  # SLAM：在 odom 系对 odom_base 做指数平滑纠偏
  slam:
    enabled: true
    smooth_gain: 0.08
    max_position_residual: 3.0
    max_yaw_residual_deg: 25.0
  # Global Matcher：在 map 系对 map_odom 做质量加权平滑
  global_matcher:
    enabled: true
    allow_converged_false: true
    base_gain: 0.15
    min_gain: 0.02
    max_gain: 0.30
    target_inlier_ratio: 0.70
    target_rmse: 0.30
    min_inlier_ratio: 0.50
    max_inlier_rmse: 0.80
    max_fitness: 20.0
    max_position_residual: 5.0
    max_yaw_residual_deg: 20.0
    # If a GM result is strong but disagrees with current map_odom by more than the smooth residual gate,
    # directly re-anchor map_odom instead of rejecting it.
    enable_hard_reanchor: true
    hard_reanchor_min_inlier_ratio: 0.70
    hard_reanchor_max_inlier_rmse: 0.35
    hard_reanchor_max_fitness: 5.0
    hard_reanchor_max_position_residual: 50.0
    hard_reanchor_max_yaw_residual_deg: 90.0

# --- 观测“新鲜度”判定（用于状态机与 FusionStatus）----------------------------
# age = now - last_*_time；超过则认为该源不可用
buffer:
  max_dr_age: 0.5
  max_slam_age: 1.0
  max_global_matcher_age: 3.0
  max_relocalization_age: 3.0
  max_queue_size: 500
  # Store odom_base history so global_matcher map_base(t_cloud) can be converted to map_odom with odom_base(t_cloud).
  odom_history_duration: 10.0
  max_global_matcher_time_offset: 0.5
