# =============================================================================
# dr_odometry_v2 配置（按功能分组）
#
# 结构：frames / topics / extrinsics / imu / wheel / gnss / localization / output / time_sync
# 设计依据：docs/dr_odometry_v2_design.md（15 维 ESKF、观测模型、时间同步）
# =============================================================================

# ---------- 坐标系（输出 Odometry 的 frame_id / child_frame_id）----------
frames:
  odom: "odom"
  base_link: "base_link"

# ---------- 话题 ----------
topics:
  imu: "/ouster/imu"                       # 输入：IMU（预测）
  can: "/can_receive_info"                 # 输入：CAN 车速（轮速观测）
  gnss: "/gnss_chc_data"                   # 输入：GNSS/组合导航（姿态/加速度/速度/位置）
  localization_pose: "/localization_v2/odom"      # 输入：定位 map->base（观测）
  localization_status: "/localization_v2/status"  # 输入：定位状态（观测门控）
  odom: "/localization/dr_odom"            # 输出：DR 里程计
  status: "/localization/dr_status"        # 输出：健康/计数
  path: "/localization/dr_path"            # 输出：轨迹（可视化）

# ---------- 传感器安装外参（T_base_sensor：把 sensor 系向量/点转到 base）----------
extrinsics:
  base_to_imu:  {translation: [0.0, 0.0, 0.0], rotation: [1,0,0, 0,1,0, 0,0,1]}
  base_to_gnss: {translation: [0.0, 0.0, 0.0], rotation: [1,0,0, 0,1,0, 0,0,1]}
  base_to_can:  {translation: [0.0, 0.0, 0.0], rotation: [1,0,0, 0,1,0, 0,0,1]}

# ---------- IMU（预测：中值积分；必开）----------
imu:
  enabled: true
  use_accel: true            # 预测是否用加速度（false 时速度靠观测维持）
  max_dt: 0.05               # 单步最大积分时间（防断流后一次跨太大）
  gyro_noise: 0.01           # 陀螺过程噪声 (rad/s)
  accel_noise: 0.2           # 加计过程噪声 (m/s²)
  gyro_bias_noise: 1.0e-5    # 陀螺零偏随机游走
  accel_bias_noise: 1.0e-4   # 加计零偏随机游走
  gravity: 9.80665
  initial_yaw_deg: 0.0       # 冷启动初始 yaw（有 GNSS 姿态/定位观测时被覆盖）

# ---------- 轮速（观测：v_body = (speed, 0, 0)）----------
wheel:
  enabled: true
  speed_is_kmh: true         # true: msg.speed 为 km/h（内部 /3.6）
  use_valid_flag: false      # true: 仅 msg.valid 时参与；false: 速度有限即参与
  velocity_noise: 0.25       # 纵向速度观测噪声 (m/s)
  nonholonomic_noise: 0.10   # 侧向/垂向≈0 约束噪声 (m/s)
  timeout: 0.5               # 观测时刻与状态时间差上限 (s)

# ---------- GNSS（观测：姿态为主，加速度/速度/位置可选）----------
gnss:
  enabled: true
  use_attitude: true         # yaw/pitch/roll 全姿态观测
  attitude_mode: "relative"  # relative: 只用姿态变化量（世界系=初始姿态系，与 LIO 一致，绝对基准消去）
                             # absolute: 绝对姿态（世界系锚 ENU，需 heading_convention 换算）
  rezero_when_static: false  # 静止重锚基准（lio 同款）。本模块基准=滤波状态本身，开启会压制零偏学习
  static_speed_eps: 0.1      # 静止判定速度阈值 (m/s)
  attitude_noise_roll_deg: 1.0
  attitude_noise_pitch_deg: 1.0
  attitude_noise_yaw_deg: 2.0
  heading_convention: "compass"  # compass: 北基准顺时针（GPCHC，2026-07 bag 实测确认）→ yaw=π/2-heading
                             # enu: 东基准逆时针 → yaw=heading
  heading_offset_deg: 0.0    # 约定换算后的附加零位偏移
  min_speed_for_heading: 0.2 # 低于此地速 yaw 噪声 ×10
  use_accel: false           # 加速度观测开关
  accel_frame: "world"       # world: h=R(a_imu-ba)+g；body: h=a_imu-ba
  accel_noise: 0.5
  use_velocity: false        # ENU 速度观测（ve/vn/vu）
  velocity_noise: 0.4
  use_position: false        # ENU 位置观测（lat/lon/alt，首帧锁原点）
  position_noise: 1.5
  timeout: 1.0

# ---------- 定位结果观测（辅助标定核心：零偏可观性的治本）----------
localization:
  enabled: false
  require_tracking: true     # 仅 status.state==TRACKING && output_valid 时观测
  require_slam_fresh: true   # last_slam_age < slam_age_limit（防 DR 模式回喂闭环）
  slam_age_limit: 0.2
  max_latency: 0.5           # 观测时刻与状态时间差上限 (s)
  pose_noise_trans: 0.05     # 位姿观测噪声 (m)
  pose_noise_yaw_deg: 0.5
  pose_noise_att_deg: 0.5
  vel_noise: 0.2             # twist 速度观测噪声 (m/s)
  # 跳变判断三档（防伪跳变污染）：小跳直收 / 大跳 N 帧一致台阶修正 / 超限拒收
  jump_soft_trans: 0.5
  jump_soft_yaw_deg: 2.0
  jump_hard_trans: 5.0
  jump_hard_yaw_deg: 15.0
  jump_confirm_frames: 3
  jump_confirm_consistency_trans: 0.5
  jump_confirm_consistency_yaw_deg: 2.0

# ---------- 输出 ----------
output:
  rate: 100.0                # 发布频率 (Hz)
  publish_tf: true          # TF 由 localization_v3 拥有
  path_max_size: 100000      # 轨迹长度上限（稀疏追加后约 1~2h 历史）
  path_min_step: 0.05        # 轨迹稀疏追加步长 (m)：移动超此距离才留点；0=每帧留点
  path_publish_rate: 2.0     # 轨迹发布频率 (Hz)：累计量无需高频
  max_extrapolate: 0.1       # 输出前向外推时间上限 (s)

# ---------- 时间同步 ----------
time_sync:
  queue_size: 512            # 事件队列容量（约 1s 数据）
  reordered_drop_warn: 100   # 乱序丢弃计数告警阈值

# ---------- 全局地图可视化（仅 RViz 观察 DR 轨迹，算法不消费）----------
# 地图原生在 map 系、DR 在自有局部系，二者无自动对齐：
# 发布到 DR 输出同系（frame_id=odom），用 offset_* 把地图粗摆到轨迹附近目测形状一致性。
map:
  enabled: true
  pcd_path: /home/hhy/2004ros/relocalization_ws/global_map_manual_imu.pcd
  topic: /localization/dr_odometry_v2/global_map
  frame_id: "odom"
  voxel_leaf: 2.0            # 降采样体素（m），199MB 地图可视化用；0=不降采样
  publish_period: 5.0        # 周期重发（latched + 定时，方便后开 RViz）
  offset_x: 0.0              # 手动对齐：地图在 DR 系中的摆放
  offset_y: 0.0
  offset_z: 0.0
  offset_yaw_deg: 0.0      # 方向修正：地图相对轨迹顺时针 90°（逆时针为正，故 -90）
