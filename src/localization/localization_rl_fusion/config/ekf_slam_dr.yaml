publish_tf: true
publish_acceleration: false

odom0: /localization/slam_odom
odom0_config: [true,  true,  true,
               true,  true,  true,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_queue_size: 20
odom0_nodelay: true
odom0_differential: false
odom0_relative: true

