frames:
  map: map
  odom: odom
  base_link: base_link
  lidar: lidar_link

topics:
  dr_odom: /localization/dr_odom
  slam_odom: /localization/slam_odom
  global_matcher_result: /localization/global_matcher/result
  initial_pose: /initialpose
  source_cloud: /localization/cloud_registered
  fused_odom: /localization/simple_fused_odom
  fused_pose: /localization/simple_fused_pose
  fused_path: /localization/simple_fused_path
  gm_source_cloud_odom: /localization/simple_fusion/gm_source_cloud_odom

runtime:
  output_rate_hz: 10.0
  publish_tf: true
  publish_map_to_odom_tf: true
  publish_odom_to_base_tf: true
  publish_path: true
  max_path_size: 50000

sync:
  max_queue_size: 300
  tolerance: 0.05
  max_pair_dt: 0.20

fusion:
  max_delta_translation: 10.0
  max_delta_rotation_rad: 1.2
  dr_prediction_weight: 1.0
  use_slam_increment: true
  slam_correction_gain: 0.25

initialization:
  allow_initialpose: true
  allow_global_matcher: true
  allow_local_auto: true

global_matcher:
  enable_correction: true
  correction_gain: 0.15
  min_interval: 1.0
  publish_source_cloud_odom: true
  cloud_use_fused_pose: true
